# infra/nginx/onchato-geoblock.conf -> /etc/nginx/snippets/onchato-geoblock.conf
#
# `include snippets/onchato-geoblock.conf;` inside every onchato server{} on 443.
# Two lists: an address on the abuse list is dropped (444); one from a sanctioned
# country (onchato-geo.conf) gets 451 "Unavailable For Legal Reasons" with a page
# for people. Both cover the site, the app, /relay, /f, /feedback and /health.
#
# The `if` sits at server level, so it runs in the server-rewrite phase, before
# any location is chosen - one line covers every location in the block. The
# error page is an internal redirect that runs that phase again, so the test is
# $onchato_geo_deny (onchato-geo.conf), which is 0 for the page itself.
#
# CORS on the 451 itself, `always`: the packaged app asks a node's /health when
# its relays refuse it, and it can read the status only if the answer carries
# CORS (a WebSocket that is refused tells the page nothing). That is how it can
# say "not available in your region" instead of "no connection".
# The abuse list first: 444 drops the connection without a response - an abuser
# gets no page and costs nothing more (onchato-geo.conf, $onchato_abuse).
if ($onchato_abuse) { return 444; }

error_page 451 /__onchato_unavailable.html;
location = /__onchato_unavailable.html {
    internal;
    root /var/www/onchato-geo;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;
}
if ($onchato_geo_deny) { return 451; }
