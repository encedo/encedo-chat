# infra/nginx/relay-node.conf — the nginx site of ONE relay node (bs2, bs3, …).
# This is a TEMPLATE: `__HOST__` is the node's public name.
#
# Render and install (step-by-step in relay/DEPLOY.md):
#
#   HOST=bs3.onchato.com
#   sed "s/__HOST__/$HOST/g" infra/nginx/relay-node.conf \
#     | sudo tee /etc/nginx/sites-available/$HOST >/dev/null
#   sudo ln -s /etc/nginx/sites-available/$HOST /etc/nginx/sites-enabled/$HOST
#
# Needs the limit zones from infra/nginx/relay-limits.conf in /etc/nginx/conf.d/
# (http{}-level, cannot live here) and a certificate already issued for the
# host — certbot runs BEFORE this file is installed, because nginx refuses to
# start on a certificate path that does not exist yet.
#
# bs1 is NOT this file: it shares the web host's config (infra/nginx/onchato.com)
# and its /relay block must be kept identical to the one below.
#
# No secrets in here — certificate PATHS, nothing else.

# --- HTTP: ACME challenge, then redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    # certbot renews over HTTP-01 through this directory. The redirect MUST be a
    # location and not a server-level `return`: a return at server level runs
    # before nginx picks a location and swallows the challenge — renewals then
    # fail with "unauthorized" and nothing about a redirect (infra/nginx/README.md).
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS: the relay's WebSocket ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __HOST__;

    ssl_certificate     /etc/letsencrypt/live/__HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
    # Inline rather than certbot's options-ssl-nginx.conf: that file only exists
    # where the certbot nginx PLUGIN ran, and the guide issues the certificate
    # with --webroot. Same policy as that file: TLS 1.2+, client's cipher order.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:relay_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The relay: plain WS on loopback 9001, TLS terminated here. No COOP/COEP —
    # a libp2p client is not a page.
    location /relay {
        proxy_pass         http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        # Read ONLY by the relay's DUMP mode (relay/README.md § Dump), to join
        # "127.0.0.1:port" with the real address. Without DUMP the header ends
        # in the ws library after the handshake and is written nowhere.
        proxy_set_header   X-Real-IP  $remote_addr;
        # A WebSocket lives for hours; the client heartbeats every ~15 s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # THE flood protection — see relay-limits.conf. Per real IP, handshake only.
        limit_conn relay_conn 20;
        limit_req  zone=relay_req burst=30 nodelay;
    }

    # Liveness for a person or an external monitor. Proves nginx + TLS + the
    # name, NOT the relay — the 101 check in relay/DEPLOY.md proves that.
    location /health {
        return 200 "__HOST__ ok\n";
        add_header Content-Type text/plain;
    }

    # A relay node serves nothing else.
    location / { return 404; }
}
