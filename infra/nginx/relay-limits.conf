# infra/nginx/relay-limits.conf — the per-IP zones relay-node.conf uses.
#
# Zones are http{}-level directives, so they cannot live in the site file; they
# go to conf.d on a relay node:
#
#   sudo cp infra/nginx/relay-limits.conf /etc/nginx/conf.d/relay-limits.conf
#
# On the WEB host (bs1) the same two zones are declared at the top of
# infra/nginx/onchato.com — do NOT install this file there as well, nginx
# refuses a zone declared twice ("relay_conn" is already bound).
#
# Why these limits exist at all: GossipSub's own per-IP scoring is switched off
# in the relay (behind the proxy every client is 127.0.0.1, so the penalty
# counted all users as one address — relay/README.md, peer scoring). The flood
# defence therefore has to stand here, at the edge, where the real address
# still exists. limit_req covers the HTTP handshake only; an established
# WebSocket is outside it.
limit_conn_zone $binary_remote_addr zone=relay_conn:10m;
limit_req_zone  $binary_remote_addr zone=relay_req:10m rate=10r/s;
