# infra/nginx/onchato-geo.conf -> /etc/nginx/conf.d/onchato-geo.conf (http{} level).
#
# $onchato_geo_blocked is 1 for a client address in a country where onchato is
# not provided (GEOBLOKADA.md; the list is infra/geoip/blocked-countries). The
# CIDRs come from infra/geoip/geoip-update.mjs, which rewrites the included file
# monthly and never leaves it empty after a failed download. Built-in `geo`
# module: no extra package, IPv4 and IPv6, a radix tree - ~27k entries cost a few
# MB. Install on EVERY node; the server blocks use it through
# snippets/onchato-geoblock.conf.
#
# The included file must exist before nginx starts: bs-setup.sh creates it
# (empty, then real) before this file goes in.
geo $onchato_geo_blocked {
    default 0;
    include /etc/nginx/onchato-geo-blocked.conf;
}

# What the server blocks test: blocked AND not the 451 page itself. The error
# page is reached by an internal redirect, and that runs the server-level `if`
# again - without this the page would 451 itself and nginx would answer a bare
# 451 with no body and no CORS (found by testing, 2026-10-10). `volatile`
# because nginx caches a map's value for the whole request, internal redirect
# included - without it the redirect sees the first evaluation and loops.
map $uri $onchato_geo_page {
    volatile;
    default 0;
    /__onchato_unavailable.html 1;
}
map "$onchato_geo_blocked$onchato_geo_page" $onchato_geo_deny {
    volatile;
    default 0;
    10 1;
}
