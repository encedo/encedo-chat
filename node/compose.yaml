# One onchato node (OPERATOR-NODE-PLAN.md). Settings: node.env (see
# node.env.example); onchato-setup.sh writes it and runs this.
#
#   docker compose --env-file node.env up -d --build
#
# Host networking throughout: STUN is UDP 3478, the mesh is IPv6 9002, and the
# per-address limits in nginx need the real client address. The relay (9001),
# its metrics (9003) and Redis listen on loopback only.
name: onchato

x-node: &node
  env_file: node.env
  restart: unless-stopped
  network_mode: host

services:
  relay:
    <<: *node
    build: { context: .., dockerfile: node/Dockerfile, args: { GIT_COMMIT: "${GIT_COMMIT:-unknown}" } }
    image: onchato-node
    command: relay
    volumes: [ "node-data:/data" ]
    # Optional: the relay writes statistics lazily and reconnects, and without
    # STATS (profile 'stats') there is no Redis at all.
    depends_on:
      redis: { condition: service_started, required: false }

  stun:
    <<: *node
    image: onchato-node
    command: stun
    volumes: [ "node-data:/data:ro" ]
    depends_on: [ relay ]

  nginx:
    <<: *node
    build: { context: .., dockerfile: node/nginx/Dockerfile }
    image: onchato-nginx
    volumes:
      - "letsencrypt:/etc/letsencrypt:ro"
      - "acme-webroot:/var/www/html"
      - "${ONCHATO_PROFILE_DIR:-/var/lib/onchato/profile}:/srv/onchato:ro"
      - "${ONCHATO_APP_DIR:-/var/lib/onchato/app}:/srv/app:ro"

  certbot:
    <<: *node
    image: certbot/certbot:v3.0.1
    entrypoint: [ "/bin/sh", "/onchato-certbot.sh" ]
    volumes:
      - "./certbot.sh:/onchato-certbot.sh:ro"
      - "letsencrypt:/etc/letsencrypt"
      - "acme-webroot:/var/www/html"

  redis:
    <<: *node
    profiles: [ stats ]
    image: redis:7.4-alpine
    # A snapshot every 15 minutes (the statistics' own window) into a volume:
    # without it every update or reboot started the 30 days from zero.
    command: [ "sh", "-c", "exec redis-server --bind 127.0.0.1 --port $${REDIS_PORT:-6379} --protected-mode yes --dir /data --save '900 1' --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru" ]
    volumes: [ "redis-data:/data" ]

  # The operator's dashboard (node/dash): 127.0.0.1 only, reached through an SSH
  # tunnel (ssh -L 8088:127.0.0.1:8088 root@<node>). Reads loopback; no Docker
  # socket on purpose. Read only, and it never holds the network key.
  dash:
    <<: *node
    build: { context: .., dockerfile: node/ops/Dockerfile }
    image: onchato-ops
    entrypoint: [ "sh", "-c", "exec node /app/node/dash/dash.mjs --on-node --port $${DASH_PORT:-8088}" ]
    # The profile, and the device list's directory of the node's volume (the list,
    # the enrolment lock, the authenticator seed for the 15-second QR) - read only.
    # Not root.kdf, not the node's own key.
    volumes:
      - "${ONCHATO_PROFILE_DIR:-/var/lib/onchato/profile}:/data/profile:ro"
      - { type: volume, source: node-data, target: /data/allow, read_only: true, volume: { subpath: allow } }
    depends_on: [ relay ]

  # --- devices admitted by list, only with ACCESS=allowlist (profile 'allowlist') ---
  # The relay follows ALLOW_PEERS; this service puts enrolled devices on it.
  enroll:
    <<: *node
    profiles: [ allowlist ]
    image: onchato-node
    command: enroll
    volumes: [ "node-data:/data" ]
    depends_on: [ relay ]

  # --- the file store, only with STORE=here (COMPOSE_PROFILES=store in node.env) ---
  kubo:
    <<: *node
    profiles: [ store ]
    image: ipfs/kubo:v0.34.1
    command: [ "daemon", "--offline", "--migrate=true" ]
    volumes:
      - "kubo-data:/data/ipfs"
      - "./kubo-init.sh:/container-init.d/001-onchato.sh:ro"

  fput:
    <<: *node
    profiles: [ store ]
    image: onchato-node
    command: fput
    depends_on: [ kubo ]

  sweeper:
    <<: *node
    profiles: [ store ]
    image: curlimages/curl:8.11.1
    entrypoint: [ "sh", "-c", "while :; do sh /ipfs-ttl.sh; sleep 60; done" ]
    environment: { IPFS_API: "http://127.0.0.1:5001", TTL: "300" }
    volumes: [ "../infra/ipfs-ttl.sh:/ipfs-ttl.sh:ro" ]
    depends_on: [ kubo ]

volumes:
  kubo-data:
  redis-data:
  node-data:
  letsencrypt:
  acme-webroot:
