# The network profile, where the apps fetch it (profileUrls) - with CORS, the
# apps read it from their own origin. Written by onchato-setup.sh.
location = /onchato/network.json {
    alias /srv/onchato/network.json;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
}
