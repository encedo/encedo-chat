# The network page on the operator's home domain (onchato-setup.sh writes it
# when that domain points at this server). Rendered by start.sh for
# __HOME_HOST__ once its certificate exists. Static files only.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __HOME_HOST__;
    ssl_certificate     /etc/letsencrypt/live/__HOME_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOME_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    root /srv/onchato/site;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy no-referrer always;
    location / { try_files $uri $uri/ =404; }
}
