# The app on this node (SERVE_APP=yes, node/onchato-setup.sh): the operator's
# copy of the onchato web app (release asset onchato-web-operator.tar.gz, in
# /srv/app) at the node's address, in place of the redirect to the home page.
# start.sh swaps it in for the template's `location /`. The node's own paths
# (/relay, /health, /onchato/..., /f) are longer prefixes and win over these.
# Headers repeated in every block on purpose: add_header is not inherited.

# The node's signed network profile, as the page loads it (app.ts adopts it).
location = /network.js {
    alias /srv/onchato/network.js;
    default_type text/javascript;
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}

location = / {
    root /srv/app;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}

location ~* \.bundle\.js$ {
    root /srv/app;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# The rest of the build (oidc.html, icons, core.wasm); an unknown path goes to the app.
location / {
    root /srv/app;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
    error_page 404 = @app;
}
location @app { return 302 /; }
