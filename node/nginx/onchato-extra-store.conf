# The file store on this node (STORE=here) - the same two locations as
# onchato.com's (infra/nginx/onchato.com), against the local Kubo. Included by
# the node's site when start.sh copies it in; the limit zones are in
# store-limits.conf (http level).
location = /f {
    # The apps upload cross-origin (another origin, a packaged app): CORS, and
    # the preflight answered before limit_except can refuse it.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "*";
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        add_header Access-Control-Allow-Headers "content-type";
        add_header Access-Control-Max-Age       86400;
        return 204;
    }
    add_header Access-Control-Allow-Origin "*" always;
    limit_except POST OPTIONS { deny all; }
    limit_req  zone=fput_req burst=20 nodelay;
    limit_conn fput_conn 4;
    client_max_body_size 128m;
    # Streamed to the prefixer, never buffered to a file first.
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://127.0.0.1:9202;
}

# Downloads straight from Kubo, the prefix NOT removed: only the app strips it
# when decrypting, so the store never hands a file back byte for byte.
location ~ ^/f/(?<cid>[A-Za-z0-9]+)$ {
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition    "attachment" always;
    limit_except GET { deny all; }
    limit_req  zone=fget_req burst=60 nodelay;
    limit_conn fget_conn 8;
    proxy_method POST;
    proxy_set_header Origin     "";
    proxy_set_header Referer    "";
    proxy_set_header User-Agent "encedo-proxy";   # Kubo refuses user agents starting with "Mozilla"
    rewrite ^ /api/v0/cat?arg=$cid&offline=true break;
    proxy_pass http://127.0.0.1:5001;
}
