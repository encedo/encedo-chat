# Enrolment of a device in a network that admits devices by list (ACCESS=
# allowlist; relay/enroll.mjs on loopback 9204). The app calls it cross-origin.
# The service limits wrong codes itself (per address, and a lock network-wide);
# this keeps the request rate sane before it gets that far.
location ^~ /onchato/enroll {
    limit_req zone=enroll_req burst=10 nodelay;
    client_max_body_size 4k;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:9204;
}
