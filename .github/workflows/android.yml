# Android bundles (Tauri 2): a .aab for Play, and a .apk a phone will install.
#
# ⚠️ Those are not one file with two endings, and the difference is why this job
# was rewritten. Reported as "the APK from Actions does not install" — and it
# could not: a release APK leaves Gradle UNSIGNED, and Android's package
# installer refuses an unsigned package before it looks at anything else. The
# same artifact also held a .aab, which is a Play upload format and not
# installable at all, so there were two ways to tap the wrong file.
#
# So the .apk is signed HERE, at the end of the build, and the .aab is not:
#
#   * The .apk is for a phone in a pocket, and it is uploaded on its own — one
#     file to download and tap, nothing to choose between.
#   * The .aab is for the Play Console and stays unsigned. The upload key never
#     comes here: signing happens on a machine that holds the keystore, and Play
#     App Signing then swaps the upload signature for the real app signing key.
#     That is Google's recommended flow rather than a workaround, and it means a
#     compromised runner cannot ship a build in our name.
#
# Which key signs the .apk — the developer key, from repository secrets:
#
#   ANDROID_KEYSTORE_B64       base64 of the .jks (`base64 -w0 key.jks`)
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the alias inside it
#   ANDROID_KEY_PASSWORD       only if the key password differs from the store's
#
# Missing secrets FAIL the job, with the list above in the error. Two tempting
# alternatives are both refused on purpose:
#
#   * A key generated per run. Every build would then be signed by a stranger:
#     it installs once and the next build REFUSES TO UPDATE OVER IT, which is
#     the "does not install" bug wearing a hat.
#   * A key committed to the repository. Then anyone holding the repository can
#     sign an update over somebody's installed app, and a test key has a way of
#     becoming the key everything was installed with.
#
# The signing key IS the identity of every sideloaded install: keep a backup of
# the .jks and its password somewhere that is not a runner, because losing it
# means no existing installation can ever be updated again — only uninstalled
# and replaced. It is not the Play upload key and must not become one.
#
# This mirrors the recipe already proven on the LAN machine
# (krzysztof-VOSTRO-15-3510, Ubuntu 24.04 x86_64), which exists because the NDK
# ships a host toolchain for linux-x86_64 ONLY — the development VM is aarch64,
# so its linker fails with `Exec format error`. GitHub's runners are x86_64.
# What this adds over that machine is a build per tag that occupies nobody.
#
# Signing the .aab afterwards, on the machine that holds the upload keystore:
#
#   jarsigner -keystore upload.jks -signedjar app-release.aab \
#             app-universal-release-unsigned.aab <alias>
#
# The signing key IS the app's identity: changing it later leaves every existing
# installation with no update path. Play App Signing is what makes that
# recoverable for the store; a sideloaded APK has no such safety net.
name: Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    name: android-aab
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }

      # Tauri's beforeBuildCommand runs `npm run web:build`, so the frontend
      # toolchain has to exist before cargo is invoked.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: impl/package-lock.json
      - run: npm ci
        working-directory: impl

      # 21, matching the JDK the working local build uses. Not a guess about the
      # minimum Gradle would accept.
      #
      # Deliberately NO `cache: gradle`, and it must stay that way: that option
      # looks for a Gradle project AT THIS POINT IN THE RUN, and ours does not
      # exist until `android init` generates it further down, into a gitignored
      # tree. There is no build file in the repository for it to find, so the
      # option does not merely miss the cache — it fails the job outright,
      # before anything is built. Rust dominates the build time anyway, and that
      # is cached below.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # NDK 27, platform 34, build-tools 34 — the same set as the machine this
      # is known to build on.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.1.12297006'

      # Globbed rather than pinned a second time: the package list above decides
      # the version, and repeating it here is how the two drift apart.
      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | head -1)" >> "$GITHUB_ENV"

      # aarch64 ONLY, and this is not an optimisation: without --target the build
      # produces all four architectures, which took a local debug build to 487 MB
      # against 7.9 MB for this. minSdk is 34, so every device that can install
      # this is 64-bit ARM anyway; x86_64 would serve emulators and ChromeOS.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/src-tauri
          key: android

      # src-tauri/gen is gitignored, so the Android project is generated here
      # rather than carried in the repository — the same `android init` the local
      # recipe runs. Keeps a large generated tree out of review and makes the
      # build reproducible from the config alone.
      - name: Generate the Android project
        run: npm run tauri -- android init
        working-directory: impl

      # After init, because the generator writes its own minSdk. It VERIFIES,
      # because a sed that matches nothing leaves the template's value in place
      # and the build would succeed while shipping a lower floor than intended.
      # Android 14 = API 34, as decided.
      - name: Pin minSdk to 34 (Android 14)
        run: |
          set -euo pipefail
          GRADLE=impl/src-tauri/gen/android/app/build.gradle.kts
          test -f "$GRADLE" || { echo "::error::$GRADLE not generated"; exit 1; }
          grep -qE 'minSdk *=' "$GRADLE" || { echo "::error::no minSdk line to patch in $GRADLE"; exit 1; }
          sed -i -E 's/minSdk *= *[0-9]+/minSdk = 34/' "$GRADLE"
          grep -qE 'minSdk *= *34' "$GRADLE" || { echo "::error::minSdk patch did not take"; exit 1; }
          grep -nE 'minSdk|targetSdk' "$GRADLE"

      # The project above is generated from a template on every run, so anything
      # we need in it has to be applied here — the same place `minSdk` is pinned.
      # The patcher asserts every anchor and fails loudly if Tauri's template has
      # moved: a silent no-op would produce an APK that installs, runs, and
      # quietly fails to be reachable in a pocket, which is the one bug it exists
      # to prevent. Its transforms are unit-tested in `test/android-patch.test.ts`.
      - name: Keep the app reachable (foreground service)
        run: node src-tauri/android/patch.mjs src-tauri/gen/android
        working-directory: impl

      # Through `npm run`, never npx: the Gradle project this generates builds
      # the Rust library by calling `npm run tauri` itself, from inside its own
      # task. With the CLI reachable only through npx there is no such script,
      # and the build dies deep in Gradle with one honest line — `Missing
      # script: "tauri"` — buried in a page of Io(Env(…)) wrapping. Going
      # through the same script the generated project does also means one
      # version, pinned by package-lock, on both sides.
      - name: Build the bundle
        run: npm run tauri -- android build --aab --apk --target aarch64
        working-directory: impl

      # Printed because the output paths move between Tauri releases, and because
      # the file is called `universal` whatever --target says — reading the name
      # as an architecture is a mistake that has already been made here.
      - name: What was produced
        if: always()
        run: find impl/src-tauri/gen/android -name '*.aab' -o -name '*.apk' | sort

      # Two commands, both required, in this order. `zipalign` first, because the
      # installer memory-maps the package and its entries have to sit on 4-byte
      # boundaries; then `apksigner`, which writes the v2/v3 signature scheme.
      # jarsigner is NOT a substitute here — it writes v1 only, and Android 11
      # and later refuse a package that has nothing else.
      - name: Sign the APK, so that a phone will take it
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # `|| true` on both pipes: `head` closing early makes the writer exit
          # on SIGPIPE, and `pipefail` would then kill the step over a pipeline
          # that did exactly what it was asked to.
          APK=$(find impl/src-tauri/gen/android -name '*unsigned*.apk' | head -1 || true)
          test -n "$APK" || { echo "::error::the build produced no unsigned APK to sign"; exit 1; }

          # Said plainly and early, because the alternative is twenty minutes of
          # Rust followed by a base64 error nobody can read.
          if [ -z "${KS_B64:-}" ] || [ -z "${KS_PASS:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::no signing key. Set ANDROID_KEYSTORE_B64 (base64 -w0 of the .jks), ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS in the repository secrets — and ANDROID_KEY_PASSWORD too if the key password differs. An unsigned APK cannot be installed, so there is nothing useful to upload without them."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/signing.jks"
          KS="$RUNNER_TEMP/signing.jks"
          ALIAS="$KEY_ALIAS"; SPASS="$KS_PASS"; KPASS="${KEY_PASS:-$KS_PASS}"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1 || true)
          test -x "$BT/apksigner" || { echo "::error::no build-tools with apksigner under $ANDROID_HOME"; exit 1; }
          OUT="encedo-chat-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:8}.apk"
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$SPASS" --key-pass "pass:$KPASS" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          # Asked, not assumed. A signature that did not take would otherwise be
          # discovered by somebody holding a phone.
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"

      # The commit is in the NAME because it is not in the package: Tauri derives
      # versionCode from the version in tauri.conf.json, so every build of 0.1.1
      # is 1001 and two of them are indistinguishable to Android — and the bundle
      # can even be byte-identical across real source changes, since the assets
      # compress to the same size. Do not use size or versionCode to tell builds
      # apart; use this.
      - uses: actions/upload-artifact@v5
        with:
          name: android-sideload-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ env.APK_OUT }}
          if-no-files-found: error
          retention-days: 7

      # Kept apart from the APK above on purpose: one artifact is a thing to tap
      # on a phone, the other is a thing to upload to Play, and putting them in
      # one zip is how an uninstallable file got tapped.
      - uses: actions/upload-artifact@v5
        with:
          name: android-aab-unsigned-${{ github.ref_name }}-${{ github.sha }}
          path: impl/src-tauri/gen/android/app/build/outputs/**/*.aab
          if-no-files-found: error
          retention-days: 7
