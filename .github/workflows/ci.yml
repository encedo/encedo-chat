# Tests on every push and PR.
#
# The browser job is the one that earns its minutes. `npm test` and `web:build`
# are both green on code that cannot run: the web build strips types with Babel
# and never type-checks, so a reference to an undefined variable ships happily
# and only fails when the line executes. That has already happened once (a
# renamed `_from` parameter took out the whole group receive path with both
# other jobs green). Only the two-browser harness catches it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release gate: desktop.yml and android.yml call this on every v* tag
  # with gate: true, and nothing they build or publish starts until unit and
  # core-rs are green on the tagged commit. The browser harness is not part of
  # the gate - it needs the live relay, and a relay hiccup must not block a
  # release; it runs on every push to main, where its result is read by hand.
  workflow_call:
    inputs:
      gate:
        type: boolean
        default: false

concurrency:
  # A new push supersedes the run in flight for the same ref. The workflow name
  # is in the group because on a tag BOTH release workflows call this one: with
  # the ref alone the second call would cancel the first one's gate.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests + web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # hem-sdk-js is a submodule and `impl/web` imports it directly — without
          # this the bundle fails to resolve it, which reads as a webpack error
          # about a missing module rather than a missing checkout step.
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # the engine runs .ts directly — no build step for tests
          cache: npm
          cache-dependency-path: impl/package-lock.json

      - run: npm ci
        working-directory: impl

      - name: Unit + offline integration tests
        run: npm test
        working-directory: impl

      - name: Production web build
        run: npm run web:build
        working-directory: impl

      # A build for another network (a made-up profile and node list) must not
      # name the public network's hosts anywhere the app runs: any hit is a
      # constant that escaped infra/network.json (lib/network.ts).
      - name: A build for another network names no onchato.com host
        run: node scripts/check-network-neutral.mjs

  # relay N-1: an operator running its own network updates its relays on its
  # own schedule, and until 1.0 nothing on the wire is versioned - so the
  # promise that a new client works with the PREVIOUS release's relay is
  # made only because this job tests it. The relay of the last release tag
  # before this commit, two sessions of this client (light and GossipSub),
  # presence and a message each way (impl/net/relay-compat-test.ts).
  relay-compat:
    name: this client against the previous release's relay (N-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0 # the tags, to find the previous release

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: impl/package-lock.json

      - run: npm ci
        working-directory: impl

      - name: The previous release's relay
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^)
          echo "previous release: $PREV"
          git worktree add "$RUNNER_TEMP/prev" "$PREV"
          cd "$RUNNER_TEMP/prev/relay" && npm ci

      - name: This client against it
        run: RELAY_DIR="$RUNNER_TEMP/prev/relay" node net/relay-compat-test.ts
        working-directory: impl

  # core-rs: the Rust engine behind eh2/wasm.ts. Its own tests reproduce the
  # known-answer vectors of docs/kat/ (the same bytes as the TypeScript
  # engine); then the module is rebuilt from source on the pinned toolchain
  # (core-rs/rust-toolchain.toml, which rustup installs by itself) and the
  # REBUILT module is driven through the TS<->WASM interop test. That proves
  # the committed source compiles to a working, wire-compatible module.
  # (Byte-for-byte reproducibility of the wasm across machines is not asserted
  # - a small toolchain-environment residue makes it fragile, and it is not
  # the user-facing guarantee; the web bundle CID is, docs/REPRODUCIBLE.md.)
  core-rs:
    name: core-rs tests + wasm interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - name: Rust tests (known-answer vectors, negatives)
        run: cargo test --quiet
        working-directory: core-rs
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: impl/package-lock.json
      - run: npm ci
        working-directory: impl
      - name: Rebuild the module from source and run TS<->WASM interop on it
        run: |
          set -euo pipefail
          ./core-rs/build.sh    # overwrites impl/core-wasm/core.wasm with the fresh build
          cd impl && node --test test/eh2-wasm.test.ts

  # The native host engine (src-tauri/src/core_native.rs) driven by the real
  # eh2/native.ts through Tauri's real command dispatch, on the mock runtime -
  # no window, no device. Nothing else reaches that seam, and the first run
  # found every shell since 0.7.27 refusing all its arguments and falling back
  # to WASM. Part of the release gate: it is the engine every shell defaults to.
  native-ipc:
    name: native host engine through Tauri IPC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - name: Linux system libraries (to compile the shell crate)
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-upgrade --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/src-tauri
          key: native-ipc
      - name: Build the mock-runtime host (examples/core-ipc.rs)
        run: cargo build --example core-ipc
        working-directory: impl/src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: impl/package-lock.json
      - run: npm ci
        working-directory: impl
      - name: native.ts <-> Tauri dispatch <-> core_native.rs, and interop with TS and WASM
        # NATIVE_IPC=1: a missing binary is a failure, not a skip.
        run: NATIVE_IPC=1 node --test test/native-ipc.test.ts
        working-directory: impl

  browser:
    name: two-browser harness
    if: ${{ !inputs.gate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: impl/package-lock.json

      - run: npm ci
        working-directory: impl

      # The harness serves impl/web/dist and refuses to start without it. The
      # unit job builds the bundle too, but jobs do not share a filesystem —
      # each one starts from a fresh checkout.
      - name: Build the web bundle
        run: npm run web:build
        working-directory: impl

      # The harness drives a real Chromium over CDP and takes the binary from
      # $CHROME (default /usr/bin/chromium-browser, which runners do not have).
      #
      # ORDER MATTERS, and it is the opposite of the obvious one. On Ubuntu
      # 24.04 `chromium-browser` is a transitional package for a SNAP, and a
      # snap-confined browser cannot read the `--user-data-dir` the harness
      # makes under /tmp: it starts, finds nothing it is allowed to use, and
      # never prints "DevTools listening" — which is the "Chromium never
      # announced a CDP endpoint" this job failed with. Google Chrome is a
      # plain .deb with no confinement and is preinstalled on the runners, so
      # it goes first, and a path under /snap is refused outright rather than
      # tried and blamed on the harness.
      #
      # (The version before THAT was `which a || which b || apt-get update &&
      # apt-get install`, which bash parses as `((a||b)||c) && d`: it installed
      # when a browser was already present and skipped when it was missing.
      # Exactly backwards, and silent. Two bugs in this step, both silent.)
      - name: Resolve a browser
        run: |
          set -euo pipefail
          pick() {
            for c in google-chrome-stable google-chrome chromium chromium-browser; do
              p="$(command -v "$c" || true)"
              [ -z "$p" ] && continue
              # `command -v` answers about a name, not about what it runs.
              real="$(readlink -f "$p")"
              case "$real" in /snap/*) echo "skipping $p — snap wrapper ($real)" >&2; continue;; esac
              echo "$p"; return 0
            done
            return 1
          }
          BIN="$(pick || true)"
          if [ -z "$BIN" ]; then
            echo "no unconfined browser found — installing Google Chrome (.deb, not the snap)"
            curl -fsSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
            BIN="$(command -v google-chrome-stable)"
          fi
          echo "CHROME=$BIN" >> "$GITHUB_ENV"
          echo "using $BIN -> $(readlink -f "$BIN")"
          "$BIN" --version

      # It reaches the REAL relay (bs1.onchato.com) — this is an integration
      # test, not a hermetic one. A relay outage fails the job, which is
      # information, but it is why this does not gate merges on its own.
      - name: Group + membership scenarios
        run: GROUP_ONLY=1 npm run browser-test
        working-directory: impl
        timeout-minutes: 15

      - name: Upload the log when it fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-test-log
          path: impl/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Storage hygiene. Build artifacts belong to their RUNS; anything shipped
  # lives on a Release, whose assets this never touches. A run's bundles are a
  # week's convenience — long enough to grab a test build off a workflow page —
  # and clutter after. Every upload in these workflows now says
  # `retention-days: 7`, so GitHub expires the FUTURE ones by itself; this job
  # sweeps the backlog uploaded before that setting existed and anything a
  # future workflow uploads without it. On main only: a PR run has no write
  # token, and one sweep per landed push is plenty.
  sweep-artifacts:
    name: sweep old artifacts
    needs: [unit, browser]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete artifacts older than a week
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '7 days ago' +%s)
          # `expired` ones still appear in the listing but cannot be deleted —
          # GitHub already took them; skip rather than error.
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate \
            -q '.artifacts[] | select(.expired | not) | "\(.id)\t\(.created_at)\t\(.name)"' \
          | while IFS=$'\t' read -r id created name; do
              [ "$(date -u -d "$created" +%s)" -lt "$CUTOFF" ] || continue
              echo "deleting: $name ($created)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
            done
