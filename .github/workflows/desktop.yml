# Desktop bundles (Tauri 2).
#
# Runs on a version tag, and on demand. The matrix covers what people actually
# install: both Linux architectures — arm64 matters because that is the machine
# this is developed on, and GitHub gives public repositories arm64 Linux runners
# at no cost — plus macOS and Windows on both architectures (x64, and ARM64
# cross-compiled from the same runner), which are built but NOT signed. An
# unsigned .dmg/.msi still installs past a warning; signing them costs an Apple
# Developer subscription and a Windows certificate, so it is a decision to make
# when there is someone to ship to, not a blocker for producing artifacts.
name: Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Rebuild ONLY latest.json for this existing tag's release (repairs a
          manifest the old per-job race crippled). Leave empty for the classic
          manual run: build bundles, release nothing.
        required: false
        default: ''

# The bundles built fine on the first tag and the job still went red, at the
# very last step: "Resource not accessible by integration" from the create-a-
# release call. Nothing was wrong with the build — the workflow token is
# read-only by default, so it may compile, bundle and upload artifacts but not
# create the draft release it was asked for. `contents: write` is the whole
# fix, and it is scoped to this workflow rather than the repository default.
permissions:
  contents: write
  # Trusted Signing authenticates through OIDC rather than a stored key: the job
  # asks GitHub for a short-lived token and exchanges it for an Azure one, so
  # there is no certificate and no password anywhere in this repository.
  # Harmless while signing is switched off — a token nobody requests is not
  # issued.
  id-token: write

jobs:
  # The draft release exists BEFORE the matrix does. Five tauri-action jobs
  # used to race to create it — two of them would both find no release for the
  # tag and both create one, TWIN DRAFTS with the assets split between them.
  # v0.5.35 shipped that way: updater-json read the first twin, found half the
  # platforms, and went red (correctly — the silent version of this was
  # v0.5.27). With the release pre-created there is nothing to race for; the
  # updater-json job still knows how to merge twins, as the belt to this
  # suspender.
  draft:
    name: draft release
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create the draft if the tag has none
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in refs/tags/*) ;; *) echo "not a tag build — nothing to create"; exit 0 ;; esac
          TAG="$GITHUB_REF_NAME"
          N=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
              | jq --arg t "$TAG" '[.[] | select(.tag_name == $t)] | length')
          if [ "$N" -eq 0 ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Encedo Chat $TAG" -F draft=true -F prerelease=false > /dev/null
            echo "draft created for $TAG"
          else
            echo "release for $TAG already exists ($N) — leaving it alone"
          fi

  bundle:
    name: ${{ matrix.label }}
    # Skipped only for the repair dispatch (a tag input): that run exists to
    # rewrite one small JSON on a draft, not to rebuild five platforms.
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    needs: draft
    runs-on: ${{ matrix.os }}
    # The OIDC subject Azure's federated credential matches against. Without
    # an environment the subject carries the REF — `ref:refs/tags/v0.5.34` —
    # which is different for every tag, and federated credentials have no
    # wildcards: the sign-in would work exactly once, for whichever tag got
    # hard-coded. With an environment the subject is the stable
    # `environment:release`, one credential for ever. The environment itself
    # is plain (no protection rules); it exists for its name.
    environment: release
    strategy:
      fail-fast: false # one platform failing should not hide the others' artifacts
      matrix:
        include:
          # ONE Linux job per architecture, producing everything that job
          # can produce — deb, rpm and AppImage in one artifact, as it always
          # has been.
          #
          # WARNING: The AppImage does not run on a VMware guest with no 3D: WebKit's
          # web process dies with `Could not create default EGL display:
          # EGL_BAD_PARAMETER`, and the host's gio modules cannot load into the
          # older glib the bundle carries. Building it on ubuntu-24.04 instead
          # was tried and MEASURED: same abort, with the missing symbol merely
          # moving from glib 2.76's to 2.84's. So the newer runner buys nothing
          # here and the split it needed is gone again.
          #
          # The .deb is the supported Linux path — it links against the host's
          # own WebKitGTK, which is why it works where the AppImage does not —
          # and the updater already knows: `desk_update_kind` answers `system`
          # for a distro package and offers a link rather than a swap.
          - { os: ubuntu-22.04,     label: linux-amd64 }
          - { os: ubuntu-22.04-arm, label: linux-arm64 }
          - { os: macos-latest,     label: macos }
          - { os: windows-latest,   label: windows }
          # Windows on ARM is cross-compiled from the x64 runner — its image
          # already ships the ARM64 MSVC tools, so this costs one extra job and
          # no new runner image. NSIS only: WiX v3, which Tauri uses for the
          # .msi, has no ARM64 target and the job would fail on it. The
          # installer itself runs emulated; the app inside is native ARM64.
          - { os: windows-latest,   label: windows-arm64,
              target: aarch64-pc-windows-msvc,
              args: '--target aarch64-pc-windows-msvc --bundles nsis' }

    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }

      # Tauri's beforeBuildCommand runs `npm run web:build`, so the frontend
      # toolchain has to be here before cargo is invoked.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: impl/package-lock.json
      - run: npm ci
        working-directory: impl

      # WebKitGTK and friends. Only Linux needs them: macOS uses WKWebView and
      # Windows uses WebView2, both supplied by the OS.
      #
      # `--no-upgrade` is what keeps this green. Half of this list is already on
      # the runner image (curl, wget, file, pkg-config, build-essential,
      # libssl-dev), so asking for it by name made apt try to UPGRADE those —
      # and an arm64 run died on exactly that: 404 for libssl3, libssl-dev, curl
      # and libcurl4 at the point versions the freshly fetched index still
      # advertised but the pool had already replaced. Nothing here needs a newer
      # curl than the image ships; the list stays complete so it also works on an
      # image that lacks something, and nothing gets upgraded underneath us.
      #
      # `--no-install-recommends` drops ~100 packages this build never touches
      # (gstreamer, pipewire, the desktop portals) — fewer archives to fetch is
      # both faster and less to 404 on.
      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-upgrade --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential curl wget file pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      # Without this every run compiles the whole dependency tree from scratch,
      # which is the difference between a two-minute job and a twenty-minute one.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/src-tauri
          key: ${{ matrix.label }}

      # Signing, and it is off until the Azure side exists.
      #
      # Turned on by repository VARIABLES, not secrets, because there is no key
      # to hold: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID plus
      # TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT and
      # TRUSTED_SIGNING_PROFILE. Every step here is conditioned on the first of
      # them, so an unconfigured repository builds exactly as it does today
      # rather than failing at a step nobody can satisfy yet.
      #
      # The signing itself is handed to Tauri rather than run after it. Tauri
      # produces the .exe and then copies it into the .msi and the NSIS
      # installer, so signing afterwards would sign the installers and leave the
      # loose binary beside them unsigned — and two downloads of one program
      # where only one is signed is worse than neither. `signCommand` is
      # invoked by Tauri for each artifact at the moment it exists, which is the
      # only point where "every copy" is achievable.
      - name: Sign in to Azure
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: The signing tool Tauri will call
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != ''
        run: dotnet tool install --global sign --prerelease

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          # The UPDATE signature, which is a different thing from the Windows
          # code signature above: this one is minisign over the bundle, checked
          # by the installed app against the public key in tauri.conf.json
          # before it will replace itself. Without these two the build still
          # produces bundles — it just produces no updater artifacts, so nothing
          # can update. That is a quiet failure, and the reason the release
          # checklist says to look for `latest.json` in the draft.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: impl
          # The overlay adds `bundle.windows.signCommand` and nothing else, so
          # an unsigned build and a signed one differ by one file that is not
          # read unless it is named here.
          args: ${{ matrix.args }} ${{ (runner.os == 'Windows' && vars.AZURE_CLIENT_ID != '') && '--config src-tauri/tauri.sign.conf.json' || '' }}
          # A tag build publishes a draft release; a manual run just leaves
          # artifacts, so the button is safe to press for a test bundle.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Encedo Chat ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # WARNING: false ON PURPOSE — the manifest has ONE writer now, the
          # `updater-json` job below. With true, each of the five matrix jobs
          # merged its own platforms into the shared draft's latest.json by
          # download-modify-upload, and the last writer dropped the others'
          # entries (v0.5.27 shipped with no darwin and no linux-aarch64 that
          # way). The .sig files this build produces still upload with the
          # bundles; only the JSON assembly moves.
          includeUpdaterJson: false

      - uses: actions/upload-artifact@v5
        with:
          name: bundles-${{ matrix.label }}
          # `target/**/bundle` rather than `target/release/bundle`: a build with
          # an explicit --target writes to target/<triple>/release/bundle, and
          # `**` matches zero segments, so one set of globs covers both.
          path: |
            impl/src-tauri/target/**/bundle/**/*.deb
            impl/src-tauri/target/**/bundle/**/*.rpm
            impl/src-tauri/target/**/bundle/**/*.AppImage
            impl/src-tauri/target/**/bundle/**/*.dmg
            impl/src-tauri/target/**/bundle/**/*.msi
            impl/src-tauri/target/**/bundle/**/*.exe
          if-no-files-found: warn
          # A run's bundles are a week's convenience, not an archive: anything
          # released lives on the Release, and anything not released was a test.
          retention-days: 7

  # ONE writer for `latest.json`, after every bundle job has finished.
  #
  # It used to be five: each matrix job ran tauri-action with
  # includeUpdaterJson, and each merge was download-modify-upload against the
  # same draft asset — jobs finishing close together read the same snapshot
  # and the last writer dropped the others' platforms. v0.5.27 shipped with no
  # darwin-aarch64 and no linux-aarch64 in its manifest: a Mac on 0.5.24 and
  # an arm64 .deb both asked, found no entry for themselves, and said nothing
  # — the updater's deliberate silence turning a CI race into "updates do not
  # work", with nothing red anywhere. Which platforms survived depended on
  # finish order, so it came and went between releases.
  #
  # This job rebuilds the manifest from the release's own assets — every
  # artifact with a .sig beside it gets its platform entries — uploads it, and
  # only THEN verifies completeness: a partial matrix leaves a red job AND a
  # usable manifest, not neither. `always()` is what lets it run over a
  # partial matrix; the completeness check is what keeps that honest.
  updater-json:
    name: updater manifest
    needs: bundle
    if: always() && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Rebuild latest.json from the release assets
        run: |
          set -euo pipefail
          # The by-tag endpoint hides drafts, so list and filter — the whole
          # point is writing into the draft before anyone publishes it.
          RELS=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
                | jq --arg t "$TAG" '[.[] | select(.tag_name == $t)] | sort_by(.created_at)')
          N=$(echo "$RELS" | jq length)
          [ "$N" -gt 0 ] || { echo "::error::no release (draft or published) for $TAG"; exit 1; }
          RID=$(echo "$RELS" | jq -r '.[0].id')

          # TWIN drafts: before the `draft` job existed, tauri-action's five
          # jobs raced to create the release and the losers' assets landed on
          # a second copy — half the platforms on each, and whichever twin got
          # published, the other half's URLs would 404. Merge every younger
          # twin into the oldest (download + upload; the API cannot move an
          # asset), then delete the emptied twin. Duplicate names keep the
          # oldest release's copy.
          if [ "$N" -gt 1 ]; then
            echo "::warning::$N releases for $TAG — merging twins into $RID"
            mkdir -p dup
            HAVE=$(echo "$RELS" | jq -r '.[0].assets[].name')
            echo "$RELS" | jq -c '.[1:][]' | while read -r rel; do
              rid2=$(echo "$rel" | jq -r '.id')
              echo "$rel" | jq -r '.assets[] | "\(.id)\t\(.name)"' | while IFS=$'\t' read -r aid name; do
                if printf '%s\n' "$HAVE" | grep -qxF "$name"; then
                  echo "skip duplicate: $name"
                else
                  echo "moving: $name"
                  gh api -H "Accept: application/octet-stream" \
                    "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "dup/$name"
                  curl -sf -X POST \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Content-Type: application/octet-stream" \
                    --data-binary @"dup/$name" \
                    "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$name" > /dev/null
                fi
              done
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$rid2"
              echo "deleted twin release $rid2"
            done
          fi

          # Re-read the survivor: the merge above may have grown its assets.
          REL=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID")

          mkdir sigs
          echo "$REL" | jq -r '.assets[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' \
          | while read -r id name; do
              gh api -H "Accept: application/octet-stream" \
                "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "sigs/$name"
            done

          json=$(jq -n --arg v "${TAG#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
                 '{version: $v, notes: "", pub_date: $d, platforms: {}}')
          # The url is the PUBLIC download path the artifact will have once the
          # draft is published — predictable from tag + name, which is exactly
          # what tauri-action used to write.
          add() {
            json=$(echo "$json" | jq --arg k "$1" --arg s "$(cat "sigs/$2.sig")" \
                   --arg u "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$2" \
                   '.platforms[$k] = {signature: $s, url: $u}')
          }
          # Name -> platform keys, mirroring what tauri-action emitted when it
          # worked: the bare os-arch key points at the self-update artifact
          # (AppImage on Linux, app.tar.gz on macOS, NSIS on Windows), the
          # suffixed keys name each bundle. A .deb/.rpm cannot replace itself —
          # the app offers a link there — but the updater still needs the entry
          # to ANSWER, and silence was the bug being fixed.
          for sig in sigs/*.sig; do
            art=$(basename "${sig%.sig}")
            case "$art" in
              *_amd64.AppImage)     add linux-x86_64 "$art"; add linux-x86_64-appimage "$art" ;;
              *_aarch64.AppImage)   add linux-aarch64 "$art"; add linux-aarch64-appimage "$art" ;;
              *_amd64.deb)          add linux-x86_64-deb "$art" ;;
              *_arm64.deb)          add linux-aarch64-deb "$art" ;;
              *.x86_64.rpm)         add linux-x86_64-rpm "$art" ;;
              *.aarch64.rpm)        add linux-aarch64-rpm "$art" ;;
              *aarch64.app.tar.gz)  add darwin-aarch64 "$art"; add darwin-aarch64-app "$art" ;;
              *x64.app.tar.gz)      add darwin-x86_64 "$art"; add darwin-x86_64-app "$art" ;;
              *_x64-setup.exe)      add windows-x86_64 "$art"; add windows-x86_64-nsis "$art" ;;
              *_x64_en-US.msi)      add windows-x86_64-msi "$art" ;;
              *_arm64-setup.exe)    add windows-aarch64 "$art"; add windows-aarch64-nsis "$art" ;;
              *) echo "::warning::unmapped updater artifact: $art" ;;
            esac
          done
          echo "$json" | jq . > latest.json
          echo "platforms:"; jq -r '.platforms | keys[]' latest.json

          # Replace, never append: a manifest the old path (or a previous
          # repair) left behind would otherwise shadow this one.
          OLD=$(echo "$REL" | jq -r '.assets[] | select(.name == "latest.json") | .id')
          [ -z "$OLD" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD"
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=latest.json" > /dev/null

          # With the manifest safely uploaded, fail loudly if a matrix
          # platform is missing — the quiet gap is the bug this job exists for.
          jq -e '.platforms | has("linux-x86_64") and has("linux-aarch64")
                 and has("darwin-aarch64") and has("windows-x86_64")
                 and has("windows-aarch64")' latest.json > /dev/null \
            || { echo "::error::latest.json is missing a matrix platform"; exit 1; }
