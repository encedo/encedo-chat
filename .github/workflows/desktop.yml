# Desktop bundles (Tauri 2).
#
# Runs on a version tag, and on demand. The matrix covers what people actually
# install: both Linux architectures — arm64 matters because that is the machine
# this is developed on, and GitHub gives public repositories arm64 Linux runners
# at no cost — plus macOS and Windows on both architectures (x64, and ARM64
# cross-compiled from the same runner), which are built but NOT signed. An
# unsigned .dmg/.msi still installs past a warning; signing them costs an Apple
# Developer subscription and a Windows certificate, so it is a decision to make
# when there is someone to ship to, not a blocker for producing artifacts.
name: Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The bundles built fine on the first tag and the job still went red, at the
# very last step: "Resource not accessible by integration" from the create-a-
# release call. Nothing was wrong with the build — the workflow token is
# read-only by default, so it may compile, bundle and upload artifacts but not
# create the draft release it was asked for. `contents: write` is the whole
# fix, and it is scoped to this workflow rather than the repository default.
permissions:
  contents: write
  # Trusted Signing authenticates through OIDC rather than a stored key: the job
  # asks GitHub for a short-lived token and exchanges it for an Azure one, so
  # there is no certificate and no password anywhere in this repository.
  # Harmless while signing is switched off — a token nobody requests is not
  # issued.
  id-token: write

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not hide the others' artifacts
      matrix:
        include:
          # ONE Linux job per architecture, producing everything that job
          # can produce — deb, rpm and AppImage in one artifact, as it always
          # has been.
          #
          # ⚠️ The AppImage does not run on a VMware guest with no 3D: WebKit's
          # web process dies with `Could not create default EGL display:
          # EGL_BAD_PARAMETER`, and the host's gio modules cannot load into the
          # older glib the bundle carries. Building it on ubuntu-24.04 instead
          # was tried and MEASURED: same abort, with the missing symbol merely
          # moving from glib 2.76's to 2.84's. So the newer runner buys nothing
          # here and the split it needed is gone again.
          #
          # The .deb is the supported Linux path — it links against the host's
          # own WebKitGTK, which is why it works where the AppImage does not —
          # and the updater already knows: `desk_update_kind` answers `system`
          # for a distro package and offers a link rather than a swap.
          - { os: ubuntu-22.04,     label: linux-amd64 }
          - { os: ubuntu-22.04-arm, label: linux-arm64 }
          - { os: macos-latest,     label: macos }
          - { os: windows-latest,   label: windows }
          # Windows on ARM is cross-compiled from the x64 runner — its image
          # already ships the ARM64 MSVC tools, so this costs one extra job and
          # no new runner image. NSIS only: WiX v3, which Tauri uses for the
          # .msi, has no ARM64 target and the job would fail on it. The
          # installer itself runs emulated; the app inside is native ARM64.
          - { os: windows-latest,   label: windows-arm64,
              target: aarch64-pc-windows-msvc,
              args: '--target aarch64-pc-windows-msvc --bundles nsis' }

    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }

      # Tauri's beforeBuildCommand runs `npm run web:build`, so the frontend
      # toolchain has to be here before cargo is invoked.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: impl/package-lock.json
      - run: npm ci
        working-directory: impl

      # WebKitGTK and friends. Only Linux needs them: macOS uses WKWebView and
      # Windows uses WebView2, both supplied by the OS.
      #
      # `--no-upgrade` is what keeps this green. Half of this list is already on
      # the runner image (curl, wget, file, pkg-config, build-essential,
      # libssl-dev), so asking for it by name made apt try to UPGRADE those —
      # and an arm64 run died on exactly that: 404 for libssl3, libssl-dev, curl
      # and libcurl4 at the point versions the freshly fetched index still
      # advertised but the pool had already replaced. Nothing here needs a newer
      # curl than the image ships; the list stays complete so it also works on an
      # image that lacks something, and nothing gets upgraded underneath us.
      #
      # `--no-install-recommends` drops ~100 packages this build never touches
      # (gstreamer, pipewire, the desktop portals) — fewer archives to fetch is
      # both faster and less to 404 on.
      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-upgrade --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential curl wget file pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      # Without this every run compiles the whole dependency tree from scratch,
      # which is the difference between a two-minute job and a twenty-minute one.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/src-tauri
          key: ${{ matrix.label }}

      # Signing, and it is off until the Azure side exists.
      #
      # Turned on by repository VARIABLES, not secrets, because there is no key
      # to hold: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID plus
      # TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT and
      # TRUSTED_SIGNING_PROFILE. Every step here is conditioned on the first of
      # them, so an unconfigured repository builds exactly as it does today
      # rather than failing at a step nobody can satisfy yet.
      #
      # The signing itself is handed to Tauri rather than run after it. Tauri
      # produces the .exe and then copies it into the .msi and the NSIS
      # installer, so signing afterwards would sign the installers and leave the
      # loose binary beside them unsigned — and two downloads of one program
      # where only one is signed is worse than neither. `signCommand` is
      # invoked by Tauri for each artifact at the moment it exists, which is the
      # only point where "every copy" is achievable.
      - name: Sign in to Azure
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: The signing tool Tauri will call
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != ''
        run: dotnet tool install --global sign --prerelease

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          # The UPDATE signature, which is a different thing from the Windows
          # code signature above: this one is minisign over the bundle, checked
          # by the installed app against the public key in tauri.conf.json
          # before it will replace itself. Without these two the build still
          # produces bundles — it just produces no updater artifacts, so nothing
          # can update. That is a quiet failure, and the reason the release
          # checklist says to look for `latest.json` in the draft.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: impl
          # The overlay adds `bundle.windows.signCommand` and nothing else, so
          # an unsigned build and a signed one differ by one file that is not
          # read unless it is named here.
          args: ${{ matrix.args }} ${{ (runner.os == 'Windows' && vars.AZURE_CLIENT_ID != '') && '--config src-tauri/tauri.sign.conf.json' || '' }}
          # A tag build publishes a draft release; a manual run just leaves
          # artifacts, so the button is safe to press for a test bundle.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Encedo Chat ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # `latest.json` is what an installed app reads. It is attached to the
          # release, and a DRAFT release's assets are not publicly downloadable —
          # so cutting a tag builds an update and publishing the release is what
          # ships it. That gate is deliberate: the alternative is that every tag
          # reaches every machine the moment CI goes green.
          includeUpdaterJson: true

      - uses: actions/upload-artifact@v5
        with:
          name: bundles-${{ matrix.label }}
          # `target/**/bundle` rather than `target/release/bundle`: a build with
          # an explicit --target writes to target/<triple>/release/bundle, and
          # `**` matches zero segments, so one set of globs covers both.
          path: |
            impl/src-tauri/target/**/bundle/**/*.deb
            impl/src-tauri/target/**/bundle/**/*.rpm
            impl/src-tauri/target/**/bundle/**/*.AppImage
            impl/src-tauri/target/**/bundle/**/*.dmg
            impl/src-tauri/target/**/bundle/**/*.msi
            impl/src-tauri/target/**/bundle/**/*.exe
          if-no-files-found: warn
