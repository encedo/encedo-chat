# Desktop bundles (Tauri 2).
#
# Runs on a version tag, and on demand. The matrix covers what people actually
# install: both Linux architectures — arm64 matters because that is the machine
# this is developed on, and GitHub gives public repositories arm64 Linux runners
# at no cost — plus macOS and Windows, which are built but NOT signed. An
# unsigned .dmg/.msi still installs past a warning; signing them costs an Apple
# Developer subscription and a Windows certificate, so it is a decision to make
# when there is someone to ship to, not a blocker for producing artifacts.
name: Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not hide the others' artifacts
      matrix:
        include:
          - { os: ubuntu-22.04,     label: linux-amd64 }
          - { os: ubuntu-22.04-arm, label: linux-arm64 }
          - { os: macos-latest,     label: macos }
          - { os: windows-latest,   label: windows }

    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }

      # Tauri's beforeBuildCommand runs `npm run web:build`, so the frontend
      # toolchain has to be here before cargo is invoked.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: impl/package-lock.json
      - run: npm ci
        working-directory: impl

      # WebKitGTK and friends. Only Linux needs them: macOS uses WKWebView and
      # Windows uses WebView2, both supplied by the OS.
      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential curl wget file pkg-config

      - uses: dtolnay/rust-toolchain@stable

      # Without this every run compiles the whole dependency tree from scratch,
      # which is the difference between a two-minute job and a twenty-minute one.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/src-tauri
          key: ${{ matrix.label }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: impl
          # A tag build publishes a draft release; a manual run just leaves
          # artifacts, so the button is safe to press for a test bundle.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Encedo Chat ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      - uses: actions/upload-artifact@v5
        with:
          name: bundles-${{ matrix.label }}
          path: |
            impl/src-tauri/target/release/bundle/**/*.deb
            impl/src-tauri/target/release/bundle/**/*.AppImage
            impl/src-tauri/target/release/bundle/**/*.dmg
            impl/src-tauri/target/release/bundle/**/*.msi
            impl/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn
