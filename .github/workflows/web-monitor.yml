# Is the web app the host serves the one that was approved? (scripts/web-monitor.mjs)
#
# Every hour, by GitHub's scheduler. A red run is mailed by GitHub to whoever
# last changed the cron line here:
#   ALARM    the served index.html is neither the signed CID nor one CI built
#            for a recent release tag - red on every run;
#   PENDING  a new release is served and not yet approved with
#            scripts/approve-web.mjs - red once every 8 hours of waiting;
#   OK       served = signed - green.
# GitHub suspends scheduled workflows after 60 days without repository activity.
name: Web monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: web-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: served web app vs signed manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: impl/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: impl
      - name: Compare
        run: node scripts/web-monitor.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
