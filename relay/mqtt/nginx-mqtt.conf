# Encedo Chat — MQTT over WebSocket, on the relay host (bs1.onchato.com), behind its nginx.
# nginx terminates TLS; mosquitto listens on 127.0.0.1 only.
#
# In the http{} block (once):
#   limit_conn_zone $binary_remote_addr zone=mqtt_conn:10m;
#   limit_req_zone  $binary_remote_addr zone=mqtt_req:10m rate=30r/s;
#
# In the server{} block for bs1.onchato.com (the relay host), next to the existing /relay location:

location /mqtt {
    proxy_pass http://127.0.0.1:9101;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Long-lived sockets: the client pings every 15 s, so anything shorter than
    # that only kills healthy connections.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Abuse control at the edge, where it belongs.
    limit_conn mqtt_conn 20;
    limit_req  zone=mqtt_req burst=50 nodelay;
}
