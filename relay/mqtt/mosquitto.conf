# Encedo Chat — MQTT fall-back transport (see README.md -> Transports).
#
# Install:  sudo cp relay/mqtt/mosquitto.conf /etc/mosquitto/conf.d/encedo-chat.conf
#           sudo cp relay/mqtt/encedo.acl     /etc/mosquitto/encedo.acl
#           sudo systemctl restart mosquitto
#
# Bind to loopback only: the internet reaches this through nginx, never directly.
listener 9101 127.0.0.1
protocol websockets

# Identity here is cryptographic, not an account: a room topic is a 32-byte
# secret only its two members can derive, and every payload is end-to-end
# encrypted. The access control that matters is the ACL below, which is what
# stops one client from subscribing to everything.
allow_anonymous true
per_listener_settings false
acl_file /etc/mosquitto/encedo.acl

# Nothing is stored. A broker that persists is a broker that has ciphertext to
# hand over; this product keeps messages only on the participants screens.
persistence false
retain_available false
max_queued_messages 0
queue_qos0_messages false
autosave_interval 0

# Fit the traffic we actually send, and refuse the rest.
message_size_limit 65536
max_keepalive 120
max_inflight_messages 20
max_connections 5000

log_type error
log_type warning
log_timestamp true
connection_messages false
