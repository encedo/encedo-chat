[package]
name = "encedo-core"
version = "0.1.0"
edition = "2021"
description = "onchato v6 core-rs: EH-2 handshake + Double Ratchet (docs/SPEC.md 6-7), native and WASM"
license = "SEE LICENSE IN ../LICENSE"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
ml-kem = { version = "0.3", default-features = false, features = ["hazmat", "zeroize"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
hkdf = { version = "0.13", default-features = false }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { version = "0.4", default-features = false }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
