<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src __CSP_SCRIPT_HASHES__; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>onchato - logowanie</title>
<style>
  :root { --bg: #f7f8f7; --ink: #16211e; --muted: #5d6b66; --box: #ffffff; --rule: #d7dedb; --accent: #0f6b57; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1513; --ink: #e6ece9; --muted: #96a5a0; --box: #16201d; --rule: #2a3733; --accent: #35c99e; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  p { margin: 0; max-width: 40ch; } .m { color: var(--muted); font-size: 14px; margin-top: 8px; }
  #pastebox { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #code { font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--box); border: 1px solid var(--rule);
    border-radius: 8px; padding: 10px 12px; max-width: min(36rem, 90vw); overflow-wrap: anywhere; user-select: all; }
  button, a.btn { font: inherit; font-size: 14px; color: var(--accent); background: none; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 14px; cursor: pointer; text-decoration: none; }
</style>
</head>
<body>
<div>
  <p id="t">Wracam do onchato…</p><p class="m" id="m"></p>
  <div id="pastebox" hidden>
    <a class="btn" id="open">Otwórz onchato</a>
    <p class="m">Aplikacja się nie otworzyła? Skopiuj ten kod i wklej go w oknie logowania w aplikacji:</p>
    <div id="code"></div>
    <button id="copy" type="button">Kopiuj kod</button>
  </div>
</div>
<!-- The provider's sign-in comes back here (the network's OIDC redirect URI).
     A sign-in started in a browser: the code goes to the app's window over a
     same-origin BroadcastChannel (the app runs under COOP, this window has no
     opener). Started by a packaged app (state "d."): the code goes on to
     onchato://, which the system hands to the app - and the page offers a
     button for it (Chrome on Android follows an app link only from a tap) and
     the code for pasting when neither works. The code alone is useless: redeeming it needs the
     verifier the app holds and the secret the network's node holds. Nothing
     here talks to the network. -->
<script>
(function () {
  var q = new URLSearchParams(location.search)
  var msg = { oidc: true, code: q.get('code') || '', state: q.get('state') || '', error: q.get('error') || '', why: q.get('error_description') || '' }
  try { history.replaceState(null, '', location.pathname) } catch (e) {}
  var t = document.getElementById('t'), m = document.getElementById('m')
  if (msg.error) { t.textContent = 'Logowanie nie powiodło się.'; m.textContent = msg.why || msg.error }
  if (msg.state.indexOf('d.') === 0) {
    var link = 'onchato://oidc?' + new URLSearchParams({ code: msg.code, state: msg.state, error: msg.error, error_description: msg.why }).toString()
    if (!msg.error) {
      t.textContent = 'Zalogowano. Wracam do aplikacji onchato…'
      document.getElementById('code').textContent = msg.code
      document.getElementById('open').href = link
      document.getElementById('pastebox').hidden = false
      document.getElementById('copy').onclick = function () {
        var b = this
        try { navigator.clipboard.writeText(msg.code).then(function () { b.textContent = 'Skopiowano' }) } catch (e) {}
      }
    }
    location.href = link
    return
  }
  var ok = false
  try { var ch = new BroadcastChannel('onchato-oidc'); ch.postMessage(msg); ch.close(); ok = true } catch (e) {}
  if (!msg.error) t.textContent = ok ? 'Zalogowano. Możesz zamknąć to okno.' : 'Ta przeglądarka nie przekazała logowania do onchato.'
  if (ok && !msg.error) setTimeout(function () { window.close() }, 600)
})()
</script>
</body>
</html>
