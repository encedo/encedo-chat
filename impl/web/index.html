<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Encedo Chat</title>
  <style>
    :root {
      --bg:#f8f8fb; --card:#fff; --border:#eff2f7; --text:#343a40; --muted:#74788d;
      --accent:#556ee6; --accent-ink:#fff; --good:#34c38f; --warn:#f1b44c; --err:#f46a6a; --off:#c8ccd8;
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    .card { width:380px; max-width:92vw; background:var(--card); border:1px solid var(--border);
      border-radius:12px; box-shadow:0 10px 30px rgba(18,38,63,.06); padding:28px; }
    h1 { margin:0 0 4px; font-size:20px; }
    .sub { margin:0 0 20px; color:var(--muted); font-size:13px; }
    label { display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; }
    .row { display:flex; gap:8px; align-items:center; }
    input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
      background:var(--bg); color:var(--text); font-size:14px; }
    input:focus { outline:2px solid var(--accent); outline-offset:1px; }
    .dot { width:12px; height:12px; border-radius:50%; background:var(--off); flex-shrink:0; transition:background .2s; }
    .dot.ok { background:var(--good); box-shadow:0 0 8px rgba(52,193,143,.6); }
    .dot.bad { background:var(--err); }
    .hint { font-size:11px; color:var(--muted); margin-top:4px; min-height:15px; }
    button { width:100%; margin-top:20px; padding:11px; border:none; border-radius:8px;
      background:var(--accent); color:var(--accent-ink); font-size:14px; font-weight:600; cursor:pointer; }
    button:hover { filter:brightness(1.06); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .toggle { margin-top:14px; text-align:center; font-size:13px; color:var(--muted); }
    .toggle a { color:var(--accent); cursor:pointer; text-decoration:none; }
    .msg { margin-top:14px; padding:9px 12px; border-radius:8px; font-size:13px; display:none; }
    .msg.err { display:block; background:#fdeaea; color:var(--err); }
    .msg.ok  { display:block; background:#e6f6f0; color:#1a7f5a; }
    #reg-handle-wrap { display:none; }
    #main { display:none; }
    .kv { font-size:13px; color:var(--muted); margin:6px 0; word-break:break-all; }
    .kv b { color:var(--text); font-weight:600; }
    .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:#eef1fd; color:var(--accent); }
    #main { width:560px; }
    .idbar { display:flex; gap:10px; align-items:center; justify-content:space-between; padding-bottom:14px; border-bottom:1px solid var(--border); margin-bottom:14px; }
    .idbar .who { font-size:13px; color:var(--muted); }
    .idbar .who b { color:var(--text); }
    textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:13px; font-family:ui-monospace,"Cascadia Code",monospace; resize:vertical; min-height:54px; }
    textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
    #chat { display:none; }
    .chat-head { display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:8px; }
    .chat-head b { color:var(--text); }
    .transport { font-size:11px; color:var(--muted); margin-left:auto; }
    #messages { height:300px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; background:var(--bg); padding:10px; font-size:14px; display:flex; flex-direction:column; gap:6px; }
    .m { padding:6px 10px; border-radius:8px; max-width:80%; word-break:break-word; }
    .m.me { align-self:flex-end; background:#eef1fd; }
    .m.peer { align-self:flex-start; background:#eff2f7; }
    .m.sys { align-self:center; color:var(--muted); font-size:12px; }
    .composer { display:flex; gap:8px; margin-top:10px; }
    .composer input { flex:1; }
    .composer button { width:auto; margin:0; padding:10px 18px; }
    #contacts { display:flex; flex-wrap:wrap; gap:6px; min-height:24px; margin-bottom:4px; }
    .contact { padding:5px 12px; border:1px solid var(--border); border-radius:20px; font-size:13px; cursor:pointer; background:var(--bg); }
    .contact:hover { border-color:var(--accent); color:var(--accent); }
    .contact .x { color:var(--muted); margin-left:6px; }
    .contact.empty { color:var(--muted); border:none; cursor:default; }
    .row2 { display:flex; gap:8px; margin-top:14px; }
  </style>
</head>
<body>
  <div class="card" id="login">
    <h1>⚡ Encedo Chat</h1>
    <p class="sub">Zaloguj się swoim HEM. Klucz tożsamości nie opuszcza urządzenia.</p>

    <label>Adres HEM</label>
    <div class="row">
      <input id="hsm" type="text" value="https://my.ence.do" autocomplete="off" />
      <span class="dot" id="status-dot" title="status HEM"></span>
    </div>
    <div class="hint" id="status-hint"></div>

    <label>Hasło</label>
    <input id="pass" type="password" autocomplete="off" />

    <div id="reg-handle-wrap">
      <label>Handle (widoczny dla kontaktów)</label>
      <input id="handle" type="text" placeholder="np. alice" autocomplete="off" />
    </div>

    <button id="go">Zaloguj</button>
    <div class="toggle" id="toggle-line">
      <span id="toggle-pre">Nie masz konta?</span> <a id="toggle">Zarejestruj tożsamość</a>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="main">
    <div class="idbar">
      <div class="who">Ja: <b id="me-handle"></b> <span class="badge" id="me-fp"></span></div>
      <button id="logout" style="width:auto;margin:0;padding:7px 14px;background:#eef1fd;color:var(--accent)">Wyloguj</button>
    </div>

    <div id="join-form">
      <label>Kontakty</label>
      <div id="contacts"></div>

      <label style="margin-top:16px">Rozmówca — nazwa</label>
      <input id="peer-name" type="text" placeholder="np. bob" autocomplete="off" />
      <label>Klucz publiczny rozmówcy (base64)</label>
      <textarea id="peer-pub" placeholder="wklej pubkey kontaktu…"></textarea>
      <div class="row2">
        <button id="join" style="flex:1;margin:0">Wejdź do pokoju</button>
        <button id="save-contact" style="width:auto;margin:0;padding:11px 14px;background:#eef1fd;color:var(--accent)">Zapisz kontakt</button>
      </div>
      <div class="msg" id="join-msg"></div>
    </div>

    <div id="chat">
      <div class="chat-head">
        <span class="dot" id="peer-dot"></span>
        <b id="peer-title"></b>
        <span class="transport">⚪ przez relay onchato · E2E (interim)</span>
      </div>
      <div id="messages"></div>
      <div class="composer">
        <input id="msg-input" type="text" placeholder="Wiadomość… (Enter = wyślij)" autocomplete="off" />
        <button id="send">Wyślij</button>
      </div>
    </div>
  </div>
</body>
</html>
