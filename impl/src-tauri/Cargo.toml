[package]
name = "encedo-chat"
version = "0.0.1"
description = "Encedo Chat desktop (Tauri 2) — a native shell over the web bundle"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller, self-contained binary for a test .deb / AppImage.
[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
