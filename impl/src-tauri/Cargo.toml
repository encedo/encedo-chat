[package]
name = "onchato"
version = "0.5.82"
description = "onchato desktop (Tauri 2) — a native shell over the web bundle"
edition = "2021"
rust-version = "1.77"

# Mobile loads the Rust side as a shared object from Java, so the crate must
# produce a library, not only a binary. `staticlib` is for iOS, `cdylib` for
# Android, `rlib` so main.rs can link it on desktop. The `_lib` suffix avoids a
# name clash with the binary target of the same package.
[lib]
name = "onchato_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what makes the shell useful at all: onchato has no
# store-and-forward, so a closed window is a person nobody can reach. The tray
# is how the app stays reachable without a window on screen.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop only, and deliberately: Android loads this same library from Java, and
# a tray or a login item mean nothing there. The webview's own `Notification` is
# refused in a packaged app (the host has to answer the permission request and
# nothing here did), which is why the notification path goes through the plugin.
# Notifications are wanted on EVERY platform. They were desktop-only by
# accident, and the accident was invisible: the whole shell is `cfg(desktop)`,
# so on Android the commands the webview calls simply did not exist and every
# banner was dropped without a word.
tauri-plugin-notification = "2"

# Phone only. The QR scanner in the webview reads whatever frames the camera
# hands it and cannot touch the lens; this plugin runs CameraX + ML Kit
# natively, so the code can be zoomed - by the person, and by the decoder
# itself when the code is too small to read. Vendored (300 KB) rather than
# taken from crates.io because it is a FORK: the zoom commands and ML Kit's
# zoom suggestions are Encedo's, and the same copy is what encedo-authenticator
# ships. Two copies now; if either ever changes, both must.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = { path = "plugins/barcode-scanner" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
# The native "save as" dialog behind a download. The webview's Save is an
# anchor with `download`; on WebView2 the page asks for a location itself
# (`showSaveFilePicker`), but WebKitGTK and WKWebView have no such API, so the
# host intercepts the download (`on_download` in `wire()`) and asks with the
# platform's own dialog. rfd is what tauri-plugin-dialog wraps; used directly,
# because a plugin would also open a JS-side surface nothing here needs.
rfd = "0.15"
# Updating in place. Desktop only, and not by preference: the plugin replaces a
# self-contained bundle, which Android does not have and a distro package is
# not — see `desk_update_kind`, which is what stops the app offering an update
# it cannot perform.
tauri-plugin-updater = "2"
# One running copy per machine. Not a nicety — see `wire()`: a second copy of
# this app is a second window of the SAME IDENTITY, and the protocol's answer to
# that is to close both sessions.
tauri-plugin-single-instance = "2"

# Reaching the WebKitGTK settings behind the webview, to turn WebRTC ON. The
# version is pinned to the one `wry` already links: two versions of this crate
# would give two incompatible `WebView` types and `with_webview` would not
# compile against ours.
[target.'cfg(target_os = "linux")'.dependencies]
# The direct plane for Linux, where WebKitGTK has no RTCPeerConnection: a
# DataChannel in Rust (`webrtc-rs`), exposed to the webview behind the same
# link interface the browser implements (`net/webrtc.ts`). Linux-only on
# purpose — WebView2 and WKWebView do WebRTC themselves, and this is ~100
# crates that Windows and macOS builds do not need to carry.
webrtc = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
bytes = "1"
async-trait = "0.1"

webkit2gtk = "=2.0.2"
# Notifications are sent by hand on Linux — see `xdg_notify` in lib.rs for the
# reason, which is that the plugin's connection dies before the banner is read.
# Already in the tree via notify-rust; naming it makes it ours to hold open.
zbus = "5"
futures-util = "0.3"

# Smaller, self-contained binary for a test .deb / AppImage.
[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
