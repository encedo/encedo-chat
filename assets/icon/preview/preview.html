<!doctype html>
<meta charset="utf-8"><title>onchato icon set</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; }
  section { padding: 24px 28px; }
  .light { background: #f4f6f5; color: #16211d; }
  .dark { background: #0A0A0A; color: #e7f2ee; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; font-weight: 600; margin: 0 0 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-end; }
  figure { margin: 0; text-align: center; }
  figcaption { font-size: 11px; opacity: .65; margin-top: 6px; font-family: ui-monospace, monospace; }
  img { image-rendering: auto; display: block; }
  .zoom img { image-rendering: pixelated; border: 1px solid rgba(128,128,128,.4); }
  .svgrow img { height: 96px; }
</style>

<section class="light">
  <h2>rasters - light background</h2>
  <div class="row">
    <figure><img src="../web/favicon-16.png" width="16" height="16" alt=""><figcaption>favicon-16.png<br>16px</figcaption></figure>
    <figure><img src="../web/favicon-32.png" width="32" height="32" alt=""><figcaption>favicon-32.png<br>32px</figcaption></figure>
    <figure><img src="../web/favicon-48.png" width="48" height="48" alt=""><figcaption>favicon-48.png<br>48px</figcaption></figure>
    <figure><img src="../web/apple-touch-icon.png" width="128" height="128" alt=""><figcaption>apple-touch-icon.png<br>180px</figcaption></figure>
    <figure><img src="../web/icon-192.png" width="128" height="128" alt=""><figcaption>icon-192.png<br>192px</figcaption></figure>
    <figure><img src="../web/icon-512.png" width="128" height="128" alt=""><figcaption>icon-512.png<br>512px</figcaption></figure>
    <figure><img src="../web/icon-512-maskable.png" width="128" height="128" alt=""><figcaption>icon-512-maskable.png<br>512px</figcaption></figure>
    <figure><img src="../ios/AppIcon-1024.png" width="128" height="128" alt=""><figcaption>AppIcon-1024.png<br>1024px</figcaption></figure>
  </div>
  <h2 style="margin-top:26px">16 and 32 px, magnified 8x (the gap and the ear must survive)</h2>
  <div class="row zoom">
    <figure><img src="favicon-16-x8.png" alt=""><figcaption>favicon-16 x8</figcaption></figure>
    <figure><img src="favicon-32-x8.png" alt=""><figcaption>favicon-32 x8</figcaption></figure>
  </div>
  <h2 style="margin-top:26px">svg sources</h2>
  <div class="row svgrow">
    <figure><img src="../src/mark.svg" alt=""><figcaption>src/mark.svg</figcaption></figure>
    <figure><img src="../src/mark-small.svg" alt=""><figcaption>src/mark-small.svg</figcaption></figure>
    <figure><img src="../src/tile-dark.svg" alt=""><figcaption>src/tile-dark.svg</figcaption></figure>
    <figure><img src="../src/tile-green.svg" alt=""><figcaption>src/tile-green.svg</figcaption></figure>
    <figure><img src="../web/favicon.svg" alt=""><figcaption>web/favicon.svg</figcaption></figure>
    <figure><img src="../android/ic_launcher_foreground.svg" alt=""><figcaption>android/ic_launcher_foreground.svg</figcaption></figure>
    <figure><img src="../android/ic_launcher_monochrome.svg" alt=""><figcaption>android/ic_launcher_monochrome.svg</figcaption></figure>
    <figure><img src="../android/ic_notification.svg" alt=""><figcaption>android/ic_notification.svg</figcaption></figure>
  </div>
  <h2 style="margin-top:26px">lockup</h2>
  <div class="row svgrow">
    <figure><img src="../lockup/lockup-horizontal.svg" alt="" style="height:56px;width:auto"><figcaption>lockup-horizontal.svg</figcaption></figure>
    <figure><img src="../lockup/lockup-dark.svg" alt="" style="height:56px;width:auto"><figcaption>lockup-dark.svg</figcaption></figure>
    <figure><img src="../lockup/lockup-light.svg" alt="" style="height:56px;width:auto"><figcaption>lockup-light.svg</figcaption></figure>
  </div>
</section>
